name: Build Android APK

# Push a tag like v1.11.4 (core version) or v1.11.4.1 (app fix on the same core)
# to publish a GitHub Release. The in-app updater installs that release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (e.g. 1.11.4.1). Empty = core version from proxy/__init__.py"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release (needs signing secrets)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships a complete Android SDK, so we only
      # verify it instead of installing packages with the setup-android action
      # (that action failed on `sdkmanager tools`).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # The proxy core is a Rust crate built with cargo-ndk.
      - name: Install NDK and Rust Android targets
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; cannot install the NDK"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          # Prebuilt cargo-ndk: compiling it from source would add minutes.
          curl -sSL -o cargo-ndk.tgz \
            https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz
          tar -xzf cargo-ndk.tgz
          find . -name 'cargo-ndk*' -type f -exec install -m 755 {} "$HOME/.cargo/bin/" \;
          cargo ndk --version

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            REL=true
          else
            V="${{ github.event.inputs.version }}"
            REL="${{ github.event.inputs.release }}"
          fi
          if [ -z "$V" ]; then
            V=$(sed -n 's/.*__version__ *= *"\([^"]*\)".*/\1/p' proxy/__init__.py)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"

      # In-app updates only work if every release is signed with the same key.
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.ver.outputs.release }}" = "true" ]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. A release signed with a random key can't be installed over the previous version. See docs/RU/README.android.md."
              exit 1
            fi
            echo "::warning::No signing key: building with a throwaway debug key (not updatable)."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersion=${{ steps.ver.outputs.version }} \
            -Pabis=arm64-v8a \
            -PupdateRepo=${{ github.repository }}

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/*.apk \
             "TgWsProxy-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy_android
          path: TgWsProxy-*.apk

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" "TgWsProxy-${{ steps.ver.outputs.version }}.apk" \
            --target "${{ github.sha }}" \
            --title "TG WS Proxy ${{ steps.ver.outputs.version }}" \
            --notes "Android build of tg-ws-proxy core $(sed -n 's/.*__version__ *= *"\([^"]*\)".*/\1/p' proxy/__init__.py)." \
            || gh release upload "$TAG" "TgWsProxy-${{ steps.ver.outputs.version }}.apk" --clobber
